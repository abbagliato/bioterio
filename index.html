<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Jovem Bioterista: jogo educativo sobre a rotina de cuidado dos camundongos no biotério.">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Jovem Bioterista</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: app de uma tela para celular — cabeçalho fixo, gaiola no centro, bandeja de itens embaixo.
   Visual único e claro ("sala limpa" do biotério), escolhido de propósito para os dois temas. */
:root{
  --bg:#E7F2EF; --panel:#FFFFFF; --ink:#1D3340; --muted:#587080;
  --accent:#1F8A84; --accent-ink:#FFFFFF; --soft:#D3EAE5; --line:#C7DCD7;
  --saw:#E6BE63; --saw-dark:#B98E35; --dirt:#7A5B33;
  --good:#2F9A55; --warn:#D9822B; --bad:#C2453B;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --aviso-h:112px; /* espaço reservado para os avisos no rodapé */
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(var(--aviso-h) + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:2px solid var(--line);
  display:flex;align-items:center;gap:8px;padding-block:8px}
.top .phase{flex:1;min-width:0}
.top .phase small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}
.top .phase b{font-family:var(--display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pts{font-family:var(--display);font-size:18px;background:var(--soft);border-radius:999px;padding:2px 12px;font-variant-numeric:tabular-nums}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:18px}

/* telas */
.screen{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:14px 24px}
.card{background:var(--panel);border-radius:18px;padding:16px;border:2px solid var(--line)}
.lead{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;
  background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:20px;box-shadow:0 4px 0 #156560}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #156560}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.small{min-height:42px;font-size:16px;padding:0 14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1;font-size:17px;white-space:nowrap;padding:0 10px}

/* personagem */
.hero{display:flex;gap:14px;align-items:center}
.avatar{width:110px;flex:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-height:48px;border-radius:14px;background:var(--soft);font-weight:800;border:2px solid transparent}
.seg button[aria-pressed="true"]{background:var(--panel);border-color:var(--accent);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800}
.field input{min-height:48px;border-radius:14px;border:2px solid var(--line);padding:0 14px;font:inherit;background:var(--panel);color:var(--ink)}

/* gaiola */
.stage{background:var(--panel);border-radius:20px;border:2px solid var(--line);padding:10px;position:relative}
.stage svg{display:block;width:100%;height:auto;max-width:100%}
.cage-title{font-family:var(--display);font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cage-title span{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:800}

/* etapas */
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.done{background:var(--good);color:#fff}
.chip.now{background:var(--warn);color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* bandeja */
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.item{background:var(--panel);border:2px solid var(--line);border-radius:16px;min-height:86px;padding:6px 4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;font-weight:800;text-align:center;line-height:1.15}
.item svg{width:40px;height:40px}
.item:active{transform:scale(.95)}
.item.used{opacity:.35}
.item.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* indicadores */
.meters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px}
.meter{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:800;color:var(--muted)}
.meter .bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:999px;transition:width .4s}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions .btn{font-size:15px;min-height:48px;padding:0 6px}

/* animais para escolher */
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{border:2px solid var(--line);border-radius:16px;padding:6px;background:var(--panel);font-weight:800;font-size:13px}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.pick svg{width:100%;height:auto}

/* mensagens */
.toast{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(110%);transition:transform .25s}
.toast.show{transform:none}
.toast div{max-width:528px;margin:0 auto;border-radius:16px;padding:10px 14px;font-weight:700;font-size:15px;line-height:1.3;color:#fff;background:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;gap:10px}
.toast.ok div{background:var(--good)} .toast.err div{background:var(--warn)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(20,40,50,.5);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--panel);width:100%;max-width:560px;max-height:calc(100% - 24px);overflow:auto;border-radius:22px 22px 0 0;margin-bottom:0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + var(--aviso-h) + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.gloss dt{font-family:var(--display);font-size:18px;color:var(--accent)}
.gl-item{padding-block:6px;border-bottom:1px solid var(--line)}
.gloss-btn span{display:none}
.gloss{margin:0}
.gloss dd{margin:2px 0 0}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

/* certificado */
.cert{border:4px double var(--accent);border-radius:20px;background:var(--panel);padding:20px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.cert h2{font-size:26px}
.cert .name{font-family:var(--display);font-size:28px;color:var(--accent);border-bottom:2px solid var(--line);padding:0 12px}
.big{font-family:var(--display);font-size:40px;color:var(--accent);font-variant-numeric:tabular-nums}

/* relógio do dia */
.clock{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.clock-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800}
.clock-top b{font-variant-numeric:tabular-nums}
.clock .bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.clock .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s linear}
.clock .btn{min-height:36px;font-size:14px;padding:0 12px;box-shadow:0 2px 0 var(--line)}

/* impressão do certificado (folha A4 deitada) */
#printCert{display:none}
@page{size:A4 landscape;margin:0}
@media print{
  body{background:#fff} body::before{display:none}
  body *{visibility:hidden}
  #printCert{display:block!important;visibility:visible;position:fixed;left:0;top:0;width:297mm;height:210mm;max-width:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* QR code */
.qr{display:grid;place-items:center;background:#FFFFFF;border-radius:16px;padding:14px;border:2px solid var(--line)}
.qr img,.qr canvas{width:240px;max-width:100%;height:auto}
.link{font-size:12px;word-break:break-all;color:var(--muted);user-select:all;-webkit-user-select:all}

/* lavagem das mãos */
.rub{position:relative;background:var(--soft);border:2px dashed var(--accent);border-radius:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.rub svg{display:block;width:100%;height:auto;pointer-events:none}
.rub span{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-weight:800;color:var(--accent);pointer-events:none}

/* várias gaiolas na mesma tela */
.multi-wrap{display:flex;flex-direction:column;gap:8px}
.mini{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px;display:grid;grid-template-columns:minmax(0,44%) minmax(0,1fr);gap:4px 10px;align-items:center}
.mini .cage-title{grid-column:1/-1;font-size:15px}
.mini .cage-title span{font-size:11.5px}
.mini svg{display:block;width:100%;height:auto}
.mini .side{display:flex;flex-direction:column;gap:6px;min-width:0}
.mini .meters{grid-template-columns:1fr 1fr;gap:3px 8px}
.mini .meter{font-size:10.5px;gap:1px}
.mini .meter .bar{height:7px}
.mini .actions{gap:5px}
.mini .actions .btn{min-height:34px;font-size:12.5px;border-radius:10px;padding:0 2px;box-shadow:0 2px 0 var(--line)}
.screen.tight{gap:8px;padding-block:8px 16px}
.screen.tight .card{padding:8px 12px;font-size:14px}

@media (max-width:370px){.tray{grid-template-columns:repeat(3,1fr)}}

/* ---------- COMPUTADOR (telas largas): gaiola grande à esquerda, controles à direita ---------- */
@media (min-width:900px){
  body{font-size:17px}
  .app{max-width:1180px}
  .top .phase b{font-size:22px}
  .gloss-btn{width:auto;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
  .gloss-btn span{display:inline;font-size:15px}
  .screen{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start;gap:18px 28px;padding-block:24px 32px}
  .screen>*{grid-column:2}
  .screen>.stage{grid-column:1;grid-row:1 / span 12}
  .screen>.stage svg{max-height:62vh;width:auto;margin:0 auto}
  .item{min-height:104px;font-size:14px}
  .item svg{width:50px;height:50px}
  .item:hover,.btn:hover{filter:brightness(1.04)}
  /* tela inicial */
  .screen[data-tela="inicio"]>*{grid-column:auto}
  .screen[data-tela="inicio"]>.hero{grid-column:1 / -1}
  .screen[data-tela="inicio"]>.btn{grid-column:1 / -1;justify-self:center;width:min(420px,100%)}
  /* EPI */
  .screen[data-tela="epi"]>.hero{grid-column:1;grid-row:1 / span 6}
  .screen[data-tela="epi"] .avatar{width:180px}
  /* várias gaiolas lado a lado */
  .screen.tight{grid-template-columns:minmax(0,1fr)}
  .screen.tight>*{grid-column:1}
  .multi-wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .mini{grid-template-columns:minmax(0,1fr);gap:8px;padding:12px}
  .mini .meter{font-size:12px} .mini .actions .btn{min-height:40px;font-size:14px}
  /* telas de texto: uma coluna centralizada */
  .screen[data-tela="fimFase"],.screen[data-tela="final"],.screen[data-tela="bloqueado"]{grid-template-columns:minmax(0,640px);justify-content:center}
  .screen[data-tela="fimFase"]>*,.screen[data-tela="final"]>*,.screen[data-tela="bloqueado"]>*{grid-column:1}
  .modal{align-items:center}
  .modal .sheet{border-radius:22px;max-width:620px;padding-bottom:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="app">
  <header class="top wrap" id="top" hidden>
    <div class="phase"><small id="phaseNum">Fase 1 de 5</small><b id="phaseName">Montar a gaiola</b></div>
    <span class="pts" id="pts" aria-label="Pontos">0</span>
    <button class="icon-btn" id="soundBtn" aria-label="Som ligado">♪</button>
    <button class="icon-btn gloss-btn" id="glossBtn" aria-label="Abrir glossário">?<span> Glossário</span></button>
  </header>
  <main class="wrap screen" id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><div><span id="toastTxt"></span></div></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
/* ==========================================================
   CUIDADOR DO BIOTÉRIO — jogo educativo
   Textos, tempos e regras ficam nas constantes abaixo.
   ========================================================== */

// ---------- CONFIGURAÇÃO (fácil de ajustar) ----------
const CFG = {
  pontos: { acerto: 10, erro: -3, montagemPerfeita: 20, bonusAbrigo: 5, troca: 15, trocaCedo: -2, repor: 5, alerta: -5, desmameCerto: 40, desmameErrado: -15, separarCerto: 5 },
  diasPorTurno: 7,           // cada volta do relógio = 7 dias (intervalo da troca de maravalha, água e ração)
  segundosPorDia: { 2: 15, 3: 10, 5: 18 }, // tempo automático: segundos de cada volta do relógio, por fase
  idadeDesmame: 21,          // dias
  turnosRotina: 3,           // fase 2: semanas
  turnosDesafio: 3,          // fase 5: semanas
  gasto: { racao: 50, agua: 55, sujeira: 65 } // por semana
};

// Ordem obrigatória da montagem
const ORDEM = [
  { id:'maravalha', nome:'Maravalha', dica:'A maravalha vai primeiro: ela forma a cama macia e absorve a umidade.' },
  { id:'enriquecimento', nome:'Enriquecimento', dica:'Depois da maravalha vem o enriquecimento ambiental: ninho, rolo ou iglu.' },
  { id:'animais', nome:'Animais', dica:'Os animais entram depois da cama e do enriquecimento prontos.' },
  { id:'grade', nome:'Grade', dica:'A grade vai por cima, depois dos animais. É nela que ficam a água e a ração.' },
  { id:'agua', nome:'Água', dica:'Com a grade no lugar, coloque o bebedouro com água fresca.' },
  { id:'racao', nome:'Ração', dica:'A ração vai no comedouro da grade, depois da água.' },
  { id:'tampa', nome:'Tampa', dica:'A tampa com filtro fecha a gaiola por último. Ela protege os animais de germes.' }
];
const ENRIQ = ['ninho','rolo','iglu'];

// Glossário: [termo, explicação para crianças]. A lista aparece em ordem alfabética.
const GLOSSARIO = [
  ['3Rs','Três regras para usar animais na ciência com responsabilidade. O nome vem do inglês: Replacement, Reduction e Refinement. Em português: Substituição (trocar animais por outros métodos sempre que der), Redução (usar o menor número possível de animais) e Refinamento (cuidar melhor para evitar dor e estresse).'],
  ['Acasalamento','Quando o macho e a fêmea ficam juntos para terem filhotes. No jogo, a gaiola de reprodução tem 1 macho com 1 ou 2 fêmeas.'],
  ['Bebedouro','Garrafinha com um bico de metal, presa na grade. O camundongo lambe o bico para beber água.'],
  ['Bem-estar animal','É o animal estar saudável, confortável e calmo: sem fome, sem sede, sem dor e sem medo, e podendo fazer o que gosta, como cavar, roer, se esconder e fazer ninho.'],
  ['Biotério','Lugar onde vivem e são cuidados os animais usados na pesquisa científica. Tem regras de limpeza e temperatura controlada para os animais ficarem saudáveis.'],
  ['Bioterista','Profissional que cuida dos animais do biotério todos os dias: dá comida e água, troca as gaiolas e observa se todos estão bem. No jogo, você é um Jovem Bioterista!'],
  ['Camundongo','Pequeno roedor, parente do rato, mas bem menor. É o animal mais usado nas pesquisas que ajudam a criar vacinas e remédios.'],
  ['CEUA','Comissão de Ética no Uso de Animais. É um grupo de pessoas que confere se uma pesquisa com animais é mesmo necessária e se os animais serão bem cuidados, antes de ela começar.'],
  ['CONCEA','Conselho Nacional de Controle de Experimentação Animal. Cria as regras do Brasil para o cuidado e o uso de animais na ciência.'],
  ['Comedouro','Parte da grade em forma de cestinha, onde fica a ração. Os camundongos pegam a comida pelas frestas.'],
  ['Desmame','Separar os filhotes da mãe quando eles já comem ração sozinhos. Nos camundongos isso acontece aos 21 dias. Machos e fêmeas vão para gaiolas diferentes.'],
  ['Enriquecimento ambiental','Objetos que deixam a casa dos animais mais divertida e confortável, como ninho, rolo e iglu. Com eles os camundongos podem se esconder, brincar, roer e fazer ninho, como fariam na natureza.'],
  ['EPI','Equipamento de Proteção Individual: as roupas e acessórios que o bioterista usa para proteger a si mesmo e os animais. No jogo: propé, jaleco, touca, máscara, óculos de proteção e luvas.'],
  ['Filhote','Camundongo bebê. Nasce sem pelo e de olhos fechados, que se abrem com 12 a 14 dias. Mama na mãe até o desmame.'],
  ['Filtro','Material na tampa da gaiola que deixa o ar passar, mas segura poeira e germes.'],
  ['Grade','Parte de metal que fica sobre a gaiola, embaixo da tampa. Segura o bebedouro e a ração.'],
  ['Higienização das mãos','Lavar bem as mãos com água e sabão, esfregando palmas, costas e entre os dedos. É o primeiro passo antes de entrar no biotério.'],
  ['Iglu','Abrigo em forma de casinha redonda, geralmente de plástico, onde os camundongos se escondem e descansam.'],
  ['Jaleco','Avental de manga comprida que protege a roupa e o corpo. Faz parte do EPI.'],
  ['Luvas','Protegem as mãos e evitam levar germes para os animais. São o último EPI a ser colocado.'],
  ['Maravalha','Raspas de madeira limpas usadas como cama. Absorvem o xixi, deixam a gaiola sequinha e os camundongos adoram cavar nelas.'],
  ['Máscara','Cobre o nariz e a boca. Evita que a gente respire o pó da gaiola e que passe germes para os animais.'],
  ['Microisolador','Gaiola de plástico transparente com tampa e filtro. Cada gaiola fica como uma casinha separada, protegida de germes.'],
  ['Ninho','Material macio, como papel picado, que os camundongos usam para montar a caminha e se aquecer. As mamães usam para proteger os filhotes.'],
  ['Óculos de proteção','Protegem os olhos de poeira e respingos. Fazem parte do EPI.'],
  ['Propé','Capa que cobre os sapatos para não levar a sujeira da rua para dentro do biotério.'],
  ['Ração','Comida dos camundongos em forma de bolinhas, com tudo o que eles precisam para crescer saudáveis.'],
  ['Roedor','Animal com dentes da frente que crescem a vida toda, como camundongos, ratos e hamsters. Por isso eles precisam roer, e o rolo de papelão ajuda.'],
  ['Rolo','Tubo de papelão onde os camundongos passam por dentro, se escondem e roem.'],
  ['Touca','Cobre o cabelo para nenhum fio cair dentro da gaiola. Faz parte do EPI.'],
  ['Troca de gaiola','Passar os animais para uma gaiola limpa, com maravalha, água e ração novas. No biotério isso costuma ser feito a cada 7 dias.']
];

// ---------- PERSONAGEM ----------
const ETNIAS = {
  branca:   { nome:'branca',   pele:'#F2D1B5', cabelos:['#6B4A2B','#C9A15A','#3B2A1E'], textura:'liso' },
  negra:    { nome:'negra',    pele:'#6A4128', cabelos:['#1E1612'], textura:'crespo' },
  parda:    { nome:'parda',    pele:'#B07A52', cabelos:['#2E1F16','#3B2A1E'], textura:'ondulado' },

// ---------- GAIOLA (microisolador, vista lateral) ----------
// g = { maravalha, enriq:[], animais:[], grade, agua(0-100), racao(0-100), tampa, sujeira(0-100) }
function gaiolaSVG(g){
  const sujo = g.sujeira||0;
  let s = `<svg viewBox="0 0 320 200" role="img" aria-label="Gaiola microisoladora">
  <path d="M30 82 L290 82 L278 186 L42 186Z" fill="#EAF6F8" stroke="#8FB3B8" stroke-width="3" stroke-linejoin="round"/>`;
  if (g.maravalha){
    s += `<path d="M36 150 Q80 140 120 148 Q170 138 220 147 Q260 140 284 150 L278 186 L42 186Z" fill="#E6BE63"/>`;
    for (let i=0;i<26;i++){ const px=48+(i*37)%228, py=156+(i*13)%26; s+=`<path d="M${px} ${py} q4 -3 8 0" stroke="#B98E35" stroke-width="1.5" fill="none"/>`; }
    if (sujo>0){
      s += `<path d="M36 150 Q80 140 120 148 Q170 138 220 147 Q260 140 284 150 L278 186 L42 186Z" fill="#7A5B33" opacity="${Math.min(.65,sujo/140)}"/>`;
      const n = Math.round(sujo/8);
      for (let i=0;i<n;i++){ s+=`<ellipse cx="${55+(i*53)%210}" cy="${158+(i*17)%22}" rx="3" ry="1.8" fill="#4E3A22"/>`; }
    }
  }
  if (g.enriq.includes('iglu')) s += `<path d="M58 152 Q58 112 96 112 Q134 112 134 152Z" fill="#E06C75" opacity=".72" stroke="#B4505A" stroke-width="2"/><path d="M84 152 Q84 136 96 136 Q108 136 108 152Z" fill="#9E3E48" opacity=".6"/>`;
  if (g.enriq.includes('rolo')) s += `<rect x="150" y="132" width="52" height="22" rx="4" fill="#C49A6C" stroke="#8C6A43" stroke-width="2"/><ellipse cx="202" cy="143" rx="6" ry="11" fill="#8C6A43"/>`;
  if (g.enriq.includes('ninho')) { [[236,146,10],[248,140,11],[260,146,10],[246,150,9]].forEach(c=> s+=`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="#FBFBF7" stroke="#D6D8D2" stroke-width="1.5"/>`); }
  // animais
  const ad = g.animais.filter(a=>!a.filhote), fi = g.animais.filter(a=>a.filhote);
  const posA = [[110,160],[190,162],[150,168],[240,166],[75,168],[215,170]];
  ad.forEach((a,i)=>{ const p=posA[i%posA.length]; s+=mouseSVG(p[0],p[1],a.jovem?.72:.95,a,i%2===1); });
  fi.forEach((a,i)=>{ s+=mouseSVG(232+(i%3)*16, 150+Math.floor(i/3)*12, .45, a, i%2===0); });
  if (g.grade){
    s += `<g stroke="#8E9AA0" stroke-width="2.2" fill="none"><path d="M30 84 L290 84"/>`;
    for (let x=40;x<290;x+=14) s+=`<path d="M${x} 84 L${x} 90"/>`;
    s += `<path d="M168 84 L184 128 L248 128 L262 84"/>`;
    for (let x=176;x<258;x+=10) s+=`<path d="M${x} 86 L${x+2} 126"/>`;
    s += `</g>`;
    const r = g.racao||0;
    if (r>0){ const top = 126 - 36*(r/100); for (let i=0;i<Math.round(r/7);i++){ s+=`<rect x="${186+(i*13)%60}" y="${top+(i*7)%Math.max(4,126-top)}" width="9" height="6" rx="3" fill="#A06A3C"/>`; } }
  }
  if (g.agua!==undefined && g.temAgua){
    const w = g.agua||0;
    s += `<g transform="rotate(-22 80 70)"><rect x="56" y="22" width="40" height="64" rx="8" fill="#F4FBFD" stroke="#7FA9B5" stroke-width="2.5"/>
      <rect x="58.5" y="${84-60*w/100}" width="35" height="${60*w/100}" rx="6" fill="#6EC3E6" opacity=".85"/>
      <rect x="70" y="86" width="12" height="22" rx="2" fill="#AEB9BD"/></g>`;
  }
  if (g.tampa){
    s += `<path d="M24 82 L34 58 L286 58 L296 82Z" fill="#DCEFF2" opacity=".85" stroke="#7FA9B5" stroke-width="3" stroke-linejoin="round"/>
      <rect x="120" y="62" width="80" height="16" rx="3" fill="#FFFFFF" stroke="#9CB8BE" stroke-width="1.5"/>`;
    for (let i=0;i<12;i++) s+=`<circle cx="${126+i*6.2}" cy="${66+(i%2)*6}" r="1.3" fill="#9CB8BE"/>`;
  }
  return s + `</svg>`;
}

// ---------- SOM (suave, opcional) ----------
let actx = null;
function tom(freqs, dur=.12){
  if (!S.som) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=f;
      const t=actx.currentTime+i*dur; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.12,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02); });
  }catch(e){}
}
const somOk = () => tom([660,880]);
const somErro = () => tom([300,240],.14);
const somFesta = () => tom([523,659,784,1047],.11);

function abrirGlossario(){
  const lista = GLOSSARIO.slice().sort((a,b)=>a[0].localeCompare(b[0],'pt',{sensitivity:'base'}));
  abrirModal(`<span class="tag">Glossário</span><h2>Palavras do biotério</h2>
    <p class="lead">${lista.length} palavras que o bioterista usa no dia a dia.</p>
    <label class="field" for="glossBusca">Procurar palavra<input id="glossBusca" type="search" autocomplete="off" placeholder="Ex.: maravalha"></label>
    <dl class="gloss" id="glossLista">${lista.map(([t,d])=>`<div class="gl-item"><dt>${t}</dt><dd>${d}</dd></div>`).join('')}</dl>
    <p class="lead" id="glossVazio" hidden>Nenhuma palavra encontrada.</p>
    <button class="btn" onclick="fecharModal()">Voltar ao jogo</button>`);
  const semAcento = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  $('glossBusca').oninput = () => {
    const q = semAcento($('glossBusca').value.trim()); let n = 0;
    $('glossLista').querySelectorAll('.gl-item').forEach(el => { const ok = !q || semAcento(el.textContent).includes(q); el.hidden = !ok; if (ok) n++; });
    $('glossVazio').hidden = n > 0;
  };
}

// Download fora do Claude: compartilhar (celular) ou baixar direto (computador)
const baixarDireto = { save: async ({filename, data}) => {
  const file = new File([data], filename, {type:'image/png'});
  if (navigator.canShare && navigator.canShare({files:[file]}) && matchMedia('(pointer:coarse)').matches){
    try{ await navigator.share({files:[file], title:'Certificado Jovem Bioterista'}); return {status:'saved'}; }
    catch(e){ if (e && e.name==='AbortError') throw {code:'declined'}; }
  }
  const u = URL.createObjectURL(data), a = document.createElement('a');
  a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 5000); return {status:'saved'};
}};

function novoToken(){
  const b = crypto.getRandomValues(new Uint8Array(8));
  return 'c-' + Array.from(b, x => (x % 36).toString(36)).join('');
}
function abrirQR(){
  if (!ARTEFATO_URL) return abrirModal(`<span class="tag">QR Code</span><h2>Hospede o jogo primeiro</h2>
    <p class="lead">O jogo foi aberto direto do arquivo, então não há um endereço para o QR Code. Coloque o arquivo num site (ou preencha SITE_URL no código) e abra por lá.</p>
    <button class="btn" onclick="fecharModal()">Entendi</button>`);
  const url = ARTEFATO_URL + '#jogar';
  abrirModal(`<span class="tag">Para o educador ou a educadora</span><h2>QR Code de convite</h2>
    <p class="lead">A criança escaneia com a câmera do celular. Cada leitura vale para <b>uma partida</b>: ao terminar, recarregar ou fechar, é preciso escanear de novo.</p>
    <div class="qr" id="qrBox"></div>
    <p class="link" id="qrLink"></p>
    <button class="btn ghost" id="qrCopiar">Copiar link</button>
    <button class="btn ghost" onclick="fecharModal()">Fechar</button>`);
  $('qrLink').textContent = url;
  if (url === QR_FIXO.url) $('qrBox').innerHTML = `<img src="${QR_FIXO.img}" alt="QR Code do jogo">`;   // QR pronto, funciona offline
  else {
    try{ new QRCode($('qrBox'), { text:url, width:480, height:480, colorDark:'#1D3340', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M }); }
    catch(e){ $('qrBox').textContent = 'Não foi possível desenhar o QR Code agora. Use o link abaixo.'; }
  }
  $('qrCopiar').onclick = () => {
    const sel = () => { const r=document.createRange(); r.selectNodeContents($('qrLink')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); aviso('Link selecionado. Copie pelo menu do aparelho.'); };
    try{ navigator.clipboard.writeText(url).then(()=>aviso('Link copiado!','ok'), sel); }catch(e){ sel(); }
  };
}

// ---------- CERTIFICADO EM IMAGEM (PNG) ----------
function caixa(x, X, Y, W, H, r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+W,Y,X+W,Y+H,r); x.arcTo(X+W,Y+H,X,Y+H,r); x.arcTo(X,Y+H,X,Y,r); x.arcTo(X,Y,X+W,Y,r); x.closePath(); }
function caber(x, txt, peso, tam, familia, max){ do { x.font = `${peso} ${tam}px ${familia}`; tam -= 2; } while (x.measureText(txt).width > max && tam > 20); }
function quebrar(x, txt, max){ const pal=txt.split(' '), linhas=[]; let l=''; pal.forEach(p=>{ const t=l?l+' '+p:p; if (x.measureText(t).width>max && l){ linhas.push(l); l=p; } else l=t; }); if(l) linhas.push(l); return linhas; }
function carregarImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }

async function desenharCertificado(){
  try{ await document.fonts.ready; }catch(e){}
  const W=1080, H=1350, c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d'), DISP='"Baloo 2", "Trebuchet MS", sans-serif', CORPO='Nunito, "Segoe UI", sans-serif';
  x.fillStyle='#E7F2EF'; x.fillRect(0,0,W,H);
  x.fillStyle='#FFFFFF'; caixa(x,50,50,W-100,H-100,44); x.fill();
  x.strokeStyle='#1F8A84'; x.lineWidth=10; caixa(x,50,50,W-100,H-100,44); x.stroke();
  x.lineWidth=3; caixa(x,74,74,W-148,H-148,32); x.stroke();
  try{
    const svg = avatarSVG(S.genero,S.ap,true).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ');
    const img = await carregarImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));
    x.drawImage(img, W/2-120, 110, 240, 280);
  }catch(e){}
  x.textAlign='center'; x.textBaseline='alphabetic';
  x.fillStyle='#1F8A84'; x.font=`800 30px ${CORPO}`; x.fillText('C E R T I F I C A D O', W/2, 450);
  x.fillStyle='#1D3340'; caber(x,'Jovem Bioterista',800,78,DISP,880); x.fillText('Jovem Bioterista', W/2, 545);
  x.fillStyle='#587080'; x.font=`600 36px ${CORPO}`; x.fillText('Certificamos que', W/2, 625);
  const nome = S.nome || 'Jovem Bioterista';
  x.fillStyle='#1F8A84'; caber(x,nome,800,84,DISP,840); x.fillText(nome, W/2, 730);
  x.strokeStyle='#C7DCD7'; x.lineWidth=3; x.beginPath(); x.moveTo(200,760); x.lineTo(W-200,760); x.stroke();
  x.fillStyle='#1D3340'; x.font=`600 36px ${CORPO}`;
  quebrar(x,'concluiu as 5 fases do jogo cuidando dos animais do biotério com responsabilidade e respeito ao bem-estar animal.',820)
    .forEach((l,i)=>x.fillText(l, W/2, 830+i*50));
  x.fillStyle='#1F8A84'; x.font=`800 120px ${DISP}`; x.fillText(String(S.pontos), W/2, 1090);
  const data = new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
  x.fillStyle='#587080'; x.font=`600 34px ${CORPO}`; x.fillText('pontos · '+data, W/2, 1145);
  x.font=`600 26px ${CORPO}`; x.fillText('Jogo educativo sobre a rotina do biotério', W/2, 1230);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej({code:'bad_request'}),'image/png'));
}

async function baixarCertificado(d){
  const btn=$('baixar'); btn.disabled=true; btn.textContent='Preparando...';
  try{
    const blob = await desenharCertificado();
    const base = (S.nome||'cuidador').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase() || 'cuidador';
    await d.save({ filename:`certificado-jovem-bioterista-${base}.png`, data:blob });
    aviso('Certificado salvo no aparelho!','ok');
  }catch(e){
    const c = e && e.code;
    if (c==='declined') aviso('Tudo bem, o certificado não foi baixado.');
    else if (c==='rate_limited') aviso('Já existe um pedido de download aberto. Tente de novo em instantes.','err');
    else { aviso('Não deu para baixar aqui. Tire um print desta tela.','err'); btn.hidden=true; $('semDownload').hidden=false; }
  }
  btn.disabled=false; btn.textContent='Baixar certificado';
}

  $('sortear').onclick=()=>{ S.ap=sortearAparencia(); S.nome=$('nome').value; telaInicio(); };
  $('glossInicio').onclick=abrirGlossario;
  $('comecar').onclick=()=>{ S.nome=$('nome').value.trim(); somOk(); irEPI(); };
}

// Mão com 5 dedos (vista da palma). esp = espelhar para a outra mão.
function maoSVG(cx, cy, pele, contorno, esp, escala=1){
  const partes =
    '<rect x="-6.5" y="-34" width="13" height="40" rx="6.5" transform="translate(-22 34) rotate(-38)"/>' + // polegar
    '<rect x="-27" y="-40" width="13" height="50" rx="6.5"/>' +  // indicador
    '<rect x="-13" y="-48" width="13" height="58" rx="6.5"/>' +  // médio
    '<rect x="1" y="-44" width="13" height="54" rx="6.5"/>' +    // anelar
    '<rect x="15" y="-30" width="11" height="40" rx="5.5"/>' +   // mínimo
    '<rect x="-27" y="0" width="54" height="62" rx="20"/>' +     // palma
    '<rect x="-17" y="50" width="34" height="40" rx="8"/>';      // punho
  return `<g transform="translate(${cx} ${cy}) scale(${(esp?-1:1)*escala} ${escala})">` +
    `<g fill="${contorno}" stroke="${contorno}" stroke-width="4" stroke-linejoin="round">${partes}</g>` +
    `<g fill="${pele}">${partes}</g>` +
    `<path d="M-14 -6 L-14 2 M0 -6 L0 2 M14 -6 L14 2" stroke="${contorno}" stroke-width="1.6" stroke-linecap="round" opacity=".45"/></g>`;
}
const iconeMao = (pele, contorno, gotas) => `<svg viewBox="0 0 40 40">${maoSVG(20, 13, pele, contorno, false, .26)}${gotas?'<circle cx="34" cy="10" r="2.6" fill="#6EC3E6"/><circle cx="6" cy="26" r="2.2" fill="#6EC3E6"/>':''}</svg>`;

// ---------- EPI (antes de cada fase) ----------
const EPI = [
  {id:'maos', nome:'Lavar as mãos', dica:'Primeiro lave bem as mãos.', icone:iconeMao('#F2C9A8','#B88A66',true)},
  {id:'prope', nome:'Propé', dica:'Depois de lavar as mãos, calce o propé por cima dos sapatos.', icone:'<svg viewBox="0 0 40 40"><path d="M6 30 Q6 18 14 16 L22 16 Q26 22 34 24 Q38 26 36 32 L8 33 Q6 33 6 30Z" fill="#BFE0EA" stroke="#8FBFCC" stroke-width="2"/><path d="M8 29 Q20 27 35 29" stroke="#8FBFCC" stroke-width="1.5" fill="none"/></svg>'},
  {id:'jaleco', nome:'Jaleco', dica:'Com o propé calçado, vista o jaleco.', icone:'<svg viewBox="0 0 40 40"><path d="M8 36 L8 14 L15 8 L20 14 L25 8 L32 14 L32 36Z" fill="#F7FBFA" stroke="#9FB5B0" stroke-width="2"/><path d="M20 14 L20 36" stroke="#9FB5B0" stroke-width="2"/></svg>'},
  {id:'touca', nome:'Touca', dica:'Com o jaleco, coloque a touca para cobrir o cabelo.', icone:'<svg viewBox="0 0 40 40"><path d="M5 26 Q5 8 20 8 Q35 8 35 26 Q20 20 5 26Z" fill="#BFE0EA" stroke="#8FBFCC" stroke-width="2"/></svg>'},
  {id:'mascara', nome:'Máscara', dica:'Depois da touca vem a máscara.', icone:'<svg viewBox="0 0 40 40"><rect x="9" y="13" width="22" height="14" rx="5" fill="#BFE0EA" stroke="#8FBFCC" stroke-width="2"/><path d="M9 17 L3 13 M31 17 L37 13" stroke="#8FBFCC" stroke-width="2"/></svg>'},
  {id:'oculos', nome:'Óculos', dica:'Depois da máscara, coloque os óculos de proteção.', icone:'<svg viewBox="0 0 40 40"><g fill="#DDF3F8" stroke="#4E7F8C" stroke-width="2.2"><rect x="4" y="14" width="14" height="11" rx="4"/><rect x="22" y="14" width="14" height="11" rx="4"/></g><path d="M18 18 L22 18" stroke="#4E7F8C" stroke-width="2.2"/></svg>'},
  {id:'luvas', nome:'Luvas', dica:'As luvas vão por último, para ficarem bem limpas.', icone:iconeMao('#8FC7A5','#5E9C78',false)}
];
// Minigame: esfregar o dedo na tela para lavar as mãos
const ESFREGAR_META = 2600; // distância total (px) a esfregar; ajuste para mais fácil ou difícil
function lavarMaos(fim){
  abrirModal(`<span class="tag">Lavagem das mãos</span><h2>Esfregue para lavar</h2>
    <p class="lead">Passe o dedo para lá e para cá sobre as mãos até fazer bastante espuma.</p>
    <div class="rub" id="rub">
      <svg viewBox="0 0 200 140" aria-hidden="true">
        ${maoSVG(62, 58, S.ap.pele, "#7a5a44", false)}
        ${maoSVG(138, 58, S.ap.pele, "#7a5a44", true)}
        <g id="espuma"></g>
      </svg>
      <span id="rubDica">Esfregue aqui</span>
    </div>
    <div class="meter"><span id="rubPct">Espuma: 0%</span><div class="bar"><i id="rubBar" style="width:0%;background:var(--accent)"></i></div></div>`);
  const pad=$('rub'), esp=$('espuma'); let ult=null, total=0, bolhas=0, feito=false;
  const mover = ev=>{
    if (feito || ult===null) return;
    const r=pad.getBoundingClientRect(), x=ev.clientX, y=ev.clientY;
    total += Math.hypot(x-ult.x, y-ult.y); ult={x,y};
    const pct=Math.min(100, Math.round(total/ESFREGAR_META*100));
    $('rubBar').style.width=pct+'%'; $('rubPct').textContent='Espuma: '+pct+'%';
    $('rubDica').hidden = pct>5;
    while (bolhas < pct*0.6){ bolhas++;
      const bx=((x-r.left)/r.width)*200 + (Math.random()*40-20), by=((y-r.top)/r.height)*140 + (Math.random()*30-15);
      esp.insertAdjacentHTML('beforeend',`<circle cx="${Math.max(20,Math.min(180,bx))}" cy="${Math.max(20,Math.min(130,by))}" r="${4+Math.random()*7}" fill="#fff" fill-opacity=".85" stroke="#9ED3E8" stroke-width="1.2"/>`); }
    if (pct>=100){ feito=true; somFesta(); setTimeout(()=>{ fecharModal(); fim(); }, 500); }
  };
  pad.addEventListener('pointerdown',ev=>{ ult={x:ev.clientX,y:ev.clientY}; try{pad.setPointerCapture(ev.pointerId);}catch(e){} });
  pad.addEventListener('pointermove',mover);
  ['pointerup','pointercancel','pointerleave'].forEach(t=>pad.addEventListener(t,()=>{ ult=null; }));
}
function irEPI(){ S.epi={passo:0, ordem:shuffle(EPI.map(e=>e.id))}; S.tela='epi'; render(); }
function telaEPI(){
  const e=S.epi, pronto = e.passo>=EPI.length;
  main.innerHTML = `
  <div class="card hero">
    <div class="avatar">${avatarSVG(S.genero,S.ap,pronto)}</div>
    <div style="min-width:0;display:flex;flex-direction:column;gap:6px">
      <span class="tag">Antes de entrar</span><h2>Prepare-se com o EPI</h2>
      <p class="lead">${pronto?'Tudo pronto! Agora você pode entrar na sala dos animais.':'Toque nos itens na ordem certa. O EPI protege você e os animais.'}</p>
    </div>
  </div>
  <div class="steps">${EPI.map((x,i)=>`<span class="chip ${i<e.passo?'done':i===e.passo?'now':''}">${i+1}. ${x.nome}</span>`).join('')}</div>
  ${pronto?`<button class="btn" id="entrar">Entrar no biotério</button>`:
  `<div class="tray">${e.ordem.map(id=>{const x=EPI.find(y=>y.id===id); const usado=EPI.findIndex(y=>y.id===id)<e.passo;
     return `<button class="item ${usado?'used':''}" data-epi="${id}" ${usado?'disabled':''}>${x.icone}${x.nome}</button>`;}).join('')}</div>`}`;
  if (pronto){ $('entrar').onclick=()=>iniciarFase(); return; }
  main.querySelectorAll('[data-epi]').forEach(b=>b.onclick=()=>{
    const certo=EPI[e.passo];
    if (b.dataset.epi===certo.id){
      if (certo.id==='maos') return lavarMaos(()=>{ e.passo++; somOk(); aviso('Mãos limpinhas!','ok'); telaEPI(); });
      e.passo++; somOk(); aviso('Muito bem!','ok'); telaEPI(); }
    else { somErro(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); aviso(certo.dica,'err'); }
  });
}

// ---------- FASES ----------
function iniciarFase(){
  const f=S.fase;
  if (f===1) return novaMontagem({destino:'f1', titulo:'Sua primeira gaiola', modo:'inicial'});
  if (f===2){ zerarRelogio(); S.turno=0; S.trocas=0; S.tela='gerenciar'; render(); return aviso('Cuide da gaiola a cada dia: ração, água e limpeza.'); }
  if (f===3){
    const c=S.gaiolas[0].g; S.idadeFilhotes=0; S.turno=0; S.desmameFeito=false; zerarRelogio();
    if (!c.enriq.includes('ninho')) c.enriq.push('ninho');
    S.filhotes = shuffle(['M','M','M','F','F','F']).map((sx,i)=>({id:'p'+i, sexo:sx, filhote:true, ocultarSexo:true}));
    c.animais = c.animais.filter(a=>!a.filhote).concat(S.filhotes);
    S.tela='gerenciar'; render();
    return aviso('Nasceram 6 filhotes! A mãe usa o ninho para mantê-los quentinhos.','ok');
  }
  if (f===4){ S.separacao={ fila:S.filhotes.map(p=>({...p, ocultarSexo:false})), M:[], F:[] }; S.tela='separar'; render(); return; }
  if (f===5){
    S.turno=0; zerarRelogio();
    S.gaiolas.forEach((x,i)=>{ x.g.racao=clamp(60+i*15); x.g.agua=clamp(85-i*20); x.g.sujeira=clamp(25+i*15); });
    S.tela='gerenciar'; render();
    return aviso('Agora são 3 gaiolas! Observe as barras de cada uma.');
  }
}

// ---------- MONTAGEM DA GAIOLA ----------
const NOMES = { maravalha:'Maravalha', ninho:'Ninho', rolo:'Rolo', iglu:'Iglu', grade:'Grade', agua:'Água', racao:'Ração', tampa:'Tampa' };
function gaiolaVazia(){ return {maravalha:false, enriq:[], animais:[], grade:false, temAgua:false, agua:0, racao:0, tampa:false, sujeira:0}; }

function novaMontagem(o){
  B = { modo:'inicial', preset:[], rotuloAnimais:'Animais', ...o, g:gaiolaVazia(), passo:0, erros:0, pronto:false,
        tray:shuffle(['maravalha','ninho','rolo','iglu','animais','grade','agua','racao','tampa']),
        pool:[{id:'m1',sexo:'M'},{id:'m2',sexo:'M'},{id:'f1',sexo:'F'},{id:'f2',sexo:'F'},{id:'f3',sexo:'F'}], sel:[] };
  S.tela='montar'; render();
}

function telaMontar(){
  const g=B.g, p=B.passo;
  const instr = B.pronto ? 'Gaiola pronta!'
    : p===2 && g.enriq.length<3 ? 'Agora: Animais. Se quiser, ainda dá para pôr mais enriquecimento.'
    : 'Agora: ' + ORDEM[p].nome + (p===1?' (ninho, rolo ou iglu)':'');
  main.innerHTML = `
  <div class="stage">
    <div class="cage-title">${B.titulo}<span>Etapa ${Math.min(p+1,7)} de 7</span></div>
    ${gaiolaSVG(g)}
  </div>
  <div class="steps">${ORDEM.map((x,i)=>`<span class="chip ${i<p||B.pronto?'done':i===p?'now':''}">${i+1}. ${x.nome}</span>`).join('')}</div>
  <p style="font-weight:800">${instr}</p>
  ${B.pronto ? `<button class="btn" id="seguir">Continuar</button>` :
  `<div class="tray">${B.tray.map(id=>{
      const usado = ENRIQ.includes(id) ? g.enriq.includes(id) : (ORDEM.findIndex(o=>o.id===id) > -1 && ORDEM.findIndex(o=>o.id===id) < p);
      const nome = id==='animais' ? B.rotuloAnimais : NOMES[id];
      return `<button class="item ${usado?'used':''}" data-it="${id}" ${usado?'disabled':''}>${ICONES[id]}${nome}</button>`; }).join('')}</div>`}`;
  if (B.pronto){ $('seguir').onclick=concluirMontagem; return; }
  main.querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>tocarItem(b.dataset.it,b));
}

function errar(btn, dica){
  B.erros++; pontos(CFG.pontos.erro); somErro(); aviso(dica,'err');
  if (btn){ btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake'); }
}

function tocarItem(id, btn){
  const g=B.g, p=B.passo;
  if (ENRIQ.includes(id)){
    if (p===0) return errar(btn, ORDEM[0].dica);
    if (p>2) return errar(btn, 'O enriquecimento entra antes dos animais, logo depois da maravalha.');
    g.enriq.push(id); pontos(CFG.pontos.acerto);
    if (id!=='rolo') pontos(CFG.pontos.bonusAbrigo);
    if (p===1) B.passo=2;
    somOk(); aviso(id==='rolo'?'Rolo colocado! Os camundongos adoram passar por dentro.':`${NOMES[id]} colocado! Abrigo e conforto valem pontos extras.`,'ok');
    return telaMontar();
  }
  const esperado = ORDEM[p].id;
  if (id!==esperado) return errar(btn, ORDEM[p].dica);
  if (id==='animais'){
    if (B.modo==='inicial') return abrirEscolha();
    g.animais = B.preset.map(a=>({...a}));
  }
  if (id==='maravalha') g.maravalha=true;
  if (id==='grade') g.grade=true;
  if (id==='agua'){ g.temAgua=true; g.agua=100; }
  if (id==='racao') g.racao=100;
  if (id==='tampa') g.tampa=true;
  avancar();
}

function avancar(){
  pontos(CFG.pontos.acerto); somOk();
  B.passo++;
  if (B.passo>=ORDEM.length){
    B.pronto=true; somFesta();
    if (B.erros===0){ pontos(CFG.pontos.montagemPerfeita); aviso(`Montagem perfeita! +${CFG.pontos.montagemPerfeita} pontos.`,'ok'); }
    else aviso('Gaiola pronta e fechada com a tampa com filtro!','ok');
  } else aviso('Certo!','ok');
  telaMontar();
}

// Escolha dos animais (montagem inicial): exatamente 1 macho + 1 ou 2 fêmeas
function abrirEscolha(){
  const mini = a => `<svg viewBox="-42 -32 84 50">${mouseSVG(0,6,1,{...a, filhote:false},false)}</svg>`;
  abrirModal(`<span class="tag">Etapa 3: Animais</span><h2>Monte o grupo de reprodução</h2>
    <p class="lead">Toque para escolher. Regra do biotério: <b>1 macho</b> com <b>1 ou 2 fêmeas</b>.</p>
    <div class="pick">${B.pool.map(a=>`<button data-a="${a.id}" aria-pressed="${B.sel.includes(a.id)}">${mini(a)}${a.sexo==='M'?'Macho':'Fêmea'}</button>`).join('')}</div>
    <p id="selInfo" style="font-weight:800"></p>
    <div class="row"><button class="btn ghost" onclick="fecharModal()">Voltar</button><button class="btn" id="confirmar">Colocar na gaiola</button></div>`);
  const info=()=>{ const m=B.sel.filter(i=>i[0]==='m').length, f=B.sel.length-m; $('selInfo').textContent=`Escolhidos: ${m} macho(s) e ${f} fêmea(s)`; };
  info();
  $('sheet').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.a; B.sel = B.sel.includes(id) ? B.sel.filter(x=>x!==id) : B.sel.concat(id);
    b.setAttribute('aria-pressed', B.sel.includes(id)); info();
  });
  $('confirmar').onclick=()=>{
    const m=B.sel.filter(i=>i[0]==='m').length, f=B.sel.length-m;
    let msg='';
    if (m===0) msg='A gaiola precisa de 1 macho para formar o grupo de reprodução.';
    else if (m>1) msg='Só pode 1 macho por gaiola. Machos juntos podem brigar.';
    else if (f===0) msg='Escolha 1 ou 2 fêmeas para ficar com o macho.';
    else if (f>2) msg='1 macho com 3 fêmeas não é permitido. Use 1 ou 2 fêmeas para respeitar o espaço da gaiola.';
    if (msg){ B.erros++; pontos(CFG.pontos.erro); somErro(); aviso(msg,'err'); return; }
    B.g.animais = B.pool.filter(a=>B.sel.includes(a.id)).map(a=>({...a}));
    fecharModal(); avancar();
  };
}

function concluirMontagem(){
  const g=B.g, d=B.destino;
  if (d==='f1'){ g.sujeira=5; S.gaiolas=[{id:'casal', nome:'Gaiola do casal', g}];
    return fimFase(['A ordem da montagem: maravalha, enriquecimento, animais, grade, água, ração e tampa.','A gaiola de reprodução tem 1 macho com 1 ou 2 fêmeas.','A tampa com filtro protege os animais de germes.']); }
  if (d==='troca'){
    const alvo=S.gaiolas[B.idx]; alvo.g=g; S.trocas++; pontos(CFG.pontos.troca);
    S.tela='gerenciar'; render(); return aviso(`Gaiola trocada! Os animais estão numa casa limpa. +${CFG.pontos.troca}`,'ok');
  }
  if (d==='desM'){ S.gaiolas.push({id:'jm', nome:'Jovens machos', g});
    return novaMontagem({destino:'desF', titulo:'Gaiola das fêmeas jovens', modo:'desmame', rotuloAnimais:'Fêmeas jovens', preset:S.separacao.F}); }
  if (d==='desF'){ S.gaiolas.push({id:'jf', nome:'Jovens fêmeas', g});
    return fimFase(['Aos 21 dias os filhotes já comem sozinhos e podem ser desmamados.','Machos e fêmeas desmamados ficam em gaiolas separadas.','Cada gaiola nova é montada do zero, na mesma ordem.']); }
}

// ---------- CUIDADO DIÁRIO (fases 2, 3 e 5) ----------
const corNivel = v => v>=60?'var(--good)':v>=30?'var(--warn)':'var(--bad)';
function bemEstar(g){ return clamp(Math.round((g.racao+g.agua+(100-g.sujeira))/3 + g.enriq.length*4)); }
function medidor(nome,v){ return `<div class="meter"><span>${nome}: ${Math.round(v)}%</span><div class="bar"><i style="width:${v}%;background:${corNivel(v)}"></i></div></div>`; }
function rotuloBem(v){ return v>=60?'Animais felizes':v>=30?'Precisam de atenção':'Precisam de você agora!'; }

// ---------- RELÓGIO: o tempo passa sozinho ----------
const relogio = { t:0, pausado:false };
const durDia = () => (CFG.segundosPorDia[S.fase] || 10) * 1000;
function relogioHTML(){
  const rest = Math.ceil((durDia()-relogio.t)/1000), pct = relogio.t/durDia()*100;
  const rotulo = `Mais ${CFG.diasPorTurno} dias em`;
  return `<div class="clock"><div class="clock-top">
    <span id="diaTxt">${relogio.pausado ? 'Tempo pausado' : `${rotulo} <b id="diaSeg">${rest}</b> s`}</span>
    <button class="btn ghost" id="pausa">${relogio.pausado ? 'Continuar' : 'Pausar'}</button></div>
    <div class="bar"><i id="diaBar" style="width:${pct}%"></i></div></div>`;
}
function ligarRelogio(){
  $('pausa').onclick = () => { relogio.pausado = !relogio.pausado; telaGerenciar(); };
}
function zerarRelogio(){ relogio.t = 0; relogio.pausado = false; }
setInterval(() => {
  // só corre na tela de cuidado, sem janela aberta e com o jogo visível
  if (S.tela!=='gerenciar' || relogio.pausado || !$('modal').hidden || document.hidden) return;
  relogio.t += 250;
  const bar=$('diaBar'), seg=$('diaSeg');
  if (bar) bar.style.width = Math.min(100, relogio.t/durDia()*100) + '%';
  if (seg) seg.textContent = Math.max(0, Math.ceil((durDia()-relogio.t)/1000));
  if (relogio.t >= durDia()){ relogio.t = 0; avancarTempo(); }
}, 250);

function telaGerenciar(){
  const f=S.fase;
  const topo = f===3 ? `Filhotes com <b>${S.idadeFilhotes} dias</b>. O desmame é aos ${CFG.idadeDesmame} dias.`
    : f===2 ? `Dia ${S.turno*CFG.diasPorTurno+1}. A cada ${CFG.diasPorTurno} dias a gaiola precisa de troca: maravalha, água e ração novas.`
    : `Semana ${S.turno+1} de ${CFG.turnosDesafio}. Cuide das 3 gaiolas: cada uma precisa de troca a cada ${CFG.diasPorTurno} dias.`;
  const multi = S.gaiolas.length>1;
  main.classList.toggle('tight', multi);
  if (multi){
    // Todas as gaiolas na mesma tela, em cartões compactos
    main.innerHTML = `<div class="card"><p>${topo}</p></div><div class="multi-wrap">` +
    S.gaiolas.map((x,i)=>{ const g=x.g, be=bemEstar(g);
      return `<div class="mini">
        <div class="cage-title">${x.nome}<span style="color:${corNivel(be)}">${rotuloBem(be)}</span></div>
        ${gaiolaSVG(g)}
        <div class="side">
          <div class="meters">${medidor('Ração',g.racao)}${medidor('Água',g.agua)}${medidor('Limpeza',100-g.sujeira)}${medidor('Bem-estar',be)}</div>
          <div class="actions">
            <button class="btn ghost" data-ac="racao" data-i="${i}">Ração</button>
            <button class="btn ghost" data-ac="agua" data-i="${i}">Água</button>
            <button class="btn ghost" data-ac="trocar" data-i="${i}">Trocar</button>
          </div></div></div>`; }).join('') + `</div>` + relogioHTML();
    main.querySelectorAll('[data-ac]').forEach(b=>b.onclick=()=>acao(b.dataset.ac, +b.dataset.i));
    ligarRelogio();
    return;
  }
  main.innerHTML = `<div class="card"><p>${topo}</p></div>` +
  S.gaiolas.map((x,i)=>{ const g=x.g, be=bemEstar(g);
    const nome = f===3 && g.animais.some(a=>a.filhote) ? x.nome+' e filhotes' : x.nome;
    return `<div class="stage" style="display:flex;flex-direction:column;gap:10px">
      <div class="cage-title">${nome}<span style="color:${corNivel(be)}">${rotuloBem(be)}</span></div>
      ${gaiolaSVG(g)}
      <div class="meters">${medidor('Ração',g.racao)}${medidor('Água',g.agua)}${medidor('Limpeza',100-g.sujeira)}${medidor('Bem-estar',be)}</div>
      <div class="actions">
        <button class="btn ghost" data-ac="racao" data-i="${i}">Ração</button>
        <button class="btn ghost" data-ac="agua" data-i="${i}">Água</button>
        <button class="btn ghost" data-ac="trocar" data-i="${i}">Trocar</button>
      </div></div>`; }).join('') +
  relogioHTML() + (f===3 ? `<button class="btn" id="desmamar">Desmamar</button>` : '');
  main.querySelectorAll('[data-ac]').forEach(b=>b.onclick=()=>acao(b.dataset.ac, +b.dataset.i));
  ligarRelogio();
  if (f===3) $('desmamar').onclick=desmamar;
}

function acao(tipo, i){
  const x=S.gaiolas[i], g=x.g;
  if (tipo==='racao' || tipo==='agua'){
    const nome = tipo==='racao'?'O comedouro':'O bebedouro';
    if (g[tipo]>=80) return aviso(`${nome} ainda está cheio. Reponha quando estiver baixando.`);
    pontos(g[tipo]<50?CFG.pontos.repor:2); g[tipo]=100; somOk();
    aviso(tipo==='racao'?'Ração reposta! Os camundongos comem pelas grades.':'Água fresca no bebedouro!','ok');
    return telaGerenciar();
  }
  if (g.sujeira<50){ pontos(CFG.pontos.trocaCedo); somErro(); return aviso('A gaiola ainda está limpa. Trocar sem precisar estressa os animais.','err'); }
  novaMontagem({ destino:'troca', idx:i, modo:'troca', titulo:'Gaiola limpa: '+x.nome, rotuloAnimais:'Animais da gaiola suja', preset:g.animais });
  aviso('Monte a gaiola limpa na ordem certa e depois passe os animais com cuidado.');
}

function avancarTempo(){
  const f=S.fase; S.turno++;
  if (f===3) S.idadeFilhotes += CFG.diasPorTurno;
  const alertas=[];
  S.gaiolas.forEach(x=>{
    const g=x.g;
    const peso = g.animais.reduce((s,a)=>s+(a.filhote?.15:a.jovem?.7:1),0);
    const fator = Math.max(.8, peso/3);
    g.racao=clamp(g.racao-CFG.gasto.racao*fator); g.agua=clamp(g.agua-CFG.gasto.agua*fator); g.sujeira=clamp(g.sujeira+CFG.gasto.sujeira*fator);
    if (g.agua<25) alertas.push(`${x.nome}: os animais estão com sede. Reponha a água.`);
    else if (g.racao<25) alertas.push(`${x.nome}: o comedouro está quase vazio.`);
    else if (g.sujeira>75) alertas.push(`${x.nome}: a gaiola está muito suja. Hora de trocar.`);
  });
  if (alertas.length){ pontos(CFG.pontos.alerta*alertas.length); somErro(); }

  if (f===2 && S.turno>=CFG.turnosRotina){
    if (S.trocas>=1) return fimFase(['Ração e água são repostas antes de acabar.','A maravalha suja é trocada por uma gaiola limpa.','Na troca, a gaiola nova é montada na mesma ordem.']);
    render(); return aviso('Antes de terminar a fase, troque a gaiola quando ela estiver suja.','err');
  }
  if (f===5 && S.turno>=CFG.turnosDesafio){
    return fimFase(['Um biotério tem muitas gaiolas e todas precisam de cuidado diário.','Olhar as barras ajuda a decidir o que fazer primeiro.','Animais bem cuidados ficam saudáveis e calmos.']);
  }
  render();
  if (f===3 && S.idadeFilhotes===CFG.idadeDesmame) return aviso('Hoje os filhotes completam 21 dias! É dia de desmame.','ok');
  if (f===3 && S.idadeFilhotes>CFG.idadeDesmame) return aviso('Os filhotes já passaram dos 21 dias. Desmame agora!','err');
  if (alertas.length) aviso(alertas[0],'err');
}

function desmamar(){
  const d=S.idadeFilhotes, alvo=CFG.idadeDesmame;
  if (d<alvo){ pontos(-5); somErro(); return aviso(`Ainda é cedo: os filhotes mamam até ${alvo} dias. Faltam ${alvo-d} dias.`,'err'); }
  if (d===alvo){ pontos(CFG.pontos.desmameCerto); somFesta(); }
  else { pontos(CFG.pontos.desmameErrado); somErro(); }
  const c=S.gaiolas[0].g; c.animais=c.animais.filter(a=>!a.filhote);
  fimFase([ d===alvo ? 'Você desmamou no dia certo: 21 dias!' : 'O desmame deve ser feito no dia certo: 21 dias. Desta vez passou um pouco.',
    'Até os 21 dias os filhotes mamam e ficam com a mãe.','O ninho ajuda a mãe a manter os filhotes aquecidos.']);
}

// ---------- DESMAME: separar por sexo ----------
function telaSeparar(){
  const s=S.separacao, p=s.fila[0];
  if (!p){
    return novaMontagem({destino:'desM', titulo:'Gaiola dos machos jovens', modo:'desmame', rotuloAnimais:'Machos jovens', preset:s.M});
  }
  const total=s.fila.length+s.M.length+s.F.length, n=s.M.length+s.F.length+1;
  main.innerHTML = `
  <div class="card" style="display:flex;flex-direction:column;gap:6px">
    <span class="tag">Dia do desmame</span><h2>Separe os filhotes</h2>
    <p class="lead">O pai e a mãe continuam na gaiola do casal. Machos e fêmeas jovens vão para gaiolas diferentes, para não terem filhotes cedo demais.</p>
  </div>
  <div class="stage" style="text-align:center">
    <div class="cage-title">Filhote ${n} de ${total}<span>♂ macho · ♀ fêmea</span></div>

    <p class="lead" style="font-size:14px">No biotério, o técnico identifica o sexo olhando o filhote de perto. Aqui a etiqueta mostra.</p>

    <button class="btn" data-s="M">Machos ♂ (${s.M.length})</button>

  main.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
    if (b.dataset.s!==p.sexo){ pontos(CFG.pontos.erro); somErro(); return aviso(`Olhe a etiqueta: este filhote é ${p.sexo==='M'?'macho ♂':'fêmea ♀'}.`,'err'); }
    s.fila.shift(); s[p.sexo].push({id:p.id, sexo:p.sexo, jovem:true}); pontos(CFG.pontos.separarCerto); somOk(); telaSeparar();
  });
}

// ---------- FIM DE FASE ----------

  $('prox').onclick=()=>{ if (f<5){ S.fase++; irEPI(); } else { S.tela='final'; render(); } };
}

// ---------- CERTIFICADO NO COMPUTADOR: impressão A4, PDF e e-mail ----------
const SERVIDOR_EMAIL = location.protocol === 'file:' ? 'http://localhost:3000/api/enviar-certificado' : '/api/enviar-certificado';
const escHTML = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = n => (n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'participante');
const arquivoPDF = n => `certificado-jovem-bioterista-${slug(n)}.pdf`;
function caixaInfo(titulo, texto){ abrirModal(`<h2>${titulo}</h2><p>${texto}</p><button class="btn" onclick="fecharModal()">Ok</button>`); }

async function certCanvasA4(nome){                // folha A4 deitada: 297 x 210 mm (1754 x 1240 px)
  try{ await document.fonts.ready; }catch(e){}
  const W=1754, H=1240, c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d'), DISP='"Baloo 2", "Trebuchet MS", sans-serif', CORPO='Nunito, "Segoe UI", sans-serif';
  x.fillStyle='#E7F2EF'; x.fillRect(0,0,W,H);
  x.fillStyle='#FFFFFF'; caixa(x,46,46,W-92,H-92,44); x.fill();
  x.strokeStyle='#1F8A84'; x.lineWidth=12; caixa(x,46,46,W-92,H-92,44); x.stroke();
  x.lineWidth=4; caixa(x,76,76,W-152,H-152,32); x.stroke();
  try{
    const svg = avatarSVG(S.genero,S.ap,true).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ');
    const img = await carregarImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));
    x.drawImage(img, W/2-105, 105, 210, 245);
  }catch(e){}
  x.textAlign='center';
  x.fillStyle='#1F8A84'; x.font=`800 34px ${CORPO}`; x.fillText('C E R T I F I C A D O', W/2, 410);
  x.fillStyle='#1D3340'; x.font=`800 100px ${DISP}`; x.fillText('Jovem Bioterista', W/2, 510);
  x.fillStyle='#587080'; x.font=`600 46px ${CORPO}`; x.fillText('Certificamos que', W/2, 590);
  x.fillStyle='#1F8A84'; caber(x,nome,800,110,DISP,1300); x.fillText(nome, W/2, 710);
  x.strokeStyle='#C7DCD7'; x.lineWidth=4; x.beginPath(); x.moveTo(330,745); x.lineTo(W-330,745); x.stroke();
  x.fillStyle='#1D3340'; x.font=`600 44px ${CORPO}`;
  quebrar(x,'concluiu as 5 fases do jogo cuidando dos animais do biotério com responsabilidade e respeito ao bem-estar animal.',1300)
    .forEach((l,i)=>x.fillText(l, W/2, 825+i*60));
  x.fillStyle='#1F8A84'; x.font=`800 76px ${DISP}`; x.fillText(`${S.pontos} pontos`, W/2, 1035);
  x.fillStyle='#587080'; x.font=`600 38px ${CORPO}`;
  x.fillText(new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}), W/2, 1100);
  return c;
}
function canvasParaPDF(cv){                       // PDF de 1 página A4 deitada com a imagem do certificado
  const bin = atob(cv.toDataURL('image/jpeg', 0.92).split(',')[1]);
  const jpg = Uint8Array.from(bin, ch => ch.charCodeAt(0)), enc = new TextEncoder(), parts = [], off = [];
  let len = 0;
  const push = b => { const u = typeof b === 'string' ? enc.encode(b) : b; parts.push(u); len += u.length; };
  const obj = (n, fn) => { off[n] = len; push(`${n} 0 obj\n`); fn(); push('\nendobj\n'); };
  const cs = 'q 842 0 0 595 0 0 cm /Im0 Do Q';
  push('%PDF-1.4\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3, () => push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 842 595] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>'));
  obj(4, () => { push(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); push(jpg); push('\nendstream'); });
  obj(5, () => push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
  const xref = len; push('xref\n0 6\n0000000000 65535 f \n');
  for (let i = 1; i <= 5; i++) push(String(off[i]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}
function salvarArquivo(blob, nome){
  const a=document.createElement('a'); a.download=nome; a.href=URL.createObjectURL(blob);
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function ligarCertificadoDesktop(){
  const nomeAtual = () => $('nmCert').value.trim() || 'Jovem Bioterista';
  const emailOk = () => { const e=$('emCert').value.trim(); if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return e; $('emCert').focus(); aviso('Digite um e-mail válido para continuar.','err'); return null; };
  $('nmCert').value = S.nome;
  $('nmCert').oninput = () => { S.nome = $('nmCert').value.trim(); main.querySelector('.name').textContent = nomeAtual(); };
  $('imprimir').onclick = async () => {
    const cv = await certCanvasA4(nomeAtual());
    let im = $('printCert'); if (!im){ im=document.createElement('img'); im.id='printCert'; im.alt='Certificado'; document.body.appendChild(im); }
    im.onload = () => window.print(); im.src = cv.toDataURL('image/png');
  };
  $('pdfA4').onclick = async () => { const n=nomeAtual(); salvarArquivo(canvasParaPDF(await certCanvasA4(n)), arquivoPDF(n)); aviso('PDF baixado na pasta Downloads.','ok'); };
  $('mailGmail').onclick = async () => {
    const email = emailOk(); if (!email) return;
    const n = nomeAtual(), arq = arquivoPDF(n);
    salvarArquivo(canvasParaPDF(await certCanvasA4(n)), arq);
    const assunto = 'Parabéns! Você ganhou seu certificado de Jovem Bioterista 🏅';
    const corpo = `Parabéns, ${n}!\n\nVocê ganhou seu certificado de Jovem Bioterista! 🏅\n\nVocê concluiu o jogo com ${S.pontos} pontos e mostrou que sabe cuidar bem dos camundongos do biotério.\n\nO seu certificado está no arquivo "${arq}" (PDF, folha A4). Anexe-o a esta mensagem antes de enviar.\n\nBom trabalho! 🐭`;
    window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(email)}&su=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`, '_blank');
    caixaInfo('E-mail aberto', `O certificado foi baixado como <b>${escHTML(arq)}</b> (pasta Downloads). No e-mail, clique no clipe, escolha esse arquivo e envie.`);
  };
  $('mailSrv').onclick = async () => {
    const email = emailOk(); if (!email) return;
    const btn = $('mailSrv'); btn.disabled = true; btn.textContent = 'Enviando...';
    try{
      const pdf = canvasParaPDF(await certCanvasA4(nomeAtual()));
      const b64 = await new Promise((ok, err) => { const f = new FileReader(); f.onload = () => ok(String(f.result).split(',')[1]); f.onerror = err; f.readAsDataURL(pdf); });
      const r = await fetch(SERVIDOR_EMAIL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ nome:nomeAtual(), email, pontos:S.pontos, pdf:b64 }) });
      const j = await r.json();
      if (!r.ok || !j.ok) throw new Error(j.erro || 'falha');
      somFesta();
      if (j.simulado) caixaInfo('Servidor em modo de teste', 'O servidor recebeu o pedido, mas ainda não tem a senha do e-mail (SMTP) configurada, então <b>nenhum e-mail foi enviado de verdade</b>. Veja o README da pasta servidor_py.');
      else caixaInfo('Enviado!', `O certificado foi enviado para <b>${escHTML(email)}</b>. Se não chegar, olhe a caixa de spam.`);
    }catch(e){
      caixaInfo('Não consegui enviar automaticamente', 'O servidor de e-mails não está ligado ou o Gmail recusou a senha. Abra o jogo pelo <b>iniciar-jovem-bioterista.bat</b> ou use o botão <b>Abrir no Gmail</b>, que abre o e-mail pronto e baixa o PDF para anexar.');
    }
    btn.disabled = false; btn.textContent = 'Enviar automático';
  };
}

// ---------- INÍCIO ----------
window.claude?.hot?.snapshot?.(()=>({S,B}));
const iniciar = d => {
  if (d && d.S){ S=d.S; B=d.B; }
  else if (!ACESSO_OK) S.tela='bloqueado';   // sem QR Code: pede para escanear
  render();

};
